{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-2">
  <h3>Marks</h3>
  <a class="btn btn-success" href="/marks/add">Add Marks</a>
</div>
<table class="table">
<thead class="table-dark"><tr><th>ID</th><th>Student</th><th>Subject</th><th>Exam</th><th>Marks</th><th>Max</th><th>Actions</th></tr></thead>
<tbody>
{% for m in marks %}
<tr>
  <td>{{ m.id }}</td><td>{{ m.student_name }}</td><td>{{ m.subject_name }}</td><td>{{ m.exam_type }}</td><td>{{ m.marks_obtained }}</td><td>{{ m.max_marks }}</td>
  <td><a href="/marks/delete/{{ m.id }}" class="btn btn-danger btn-sm">Delete</a></td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
