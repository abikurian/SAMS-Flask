<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SAMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#0f1724; color:#e6eef8; }
    .card { background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); }
    a { color:#9be7ff; }
    .btn-primary { background:#06b6d4; border:0; }
    .table { color: #e6eef8; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg" style="background:#071126;">
  <div class="container-fluid">
    <a class="navbar-brand text-white" href="/">SAMS</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/students">Students</a></li>
        <li class="nav-item"><a class="nav-link" href="/subjects">Subjects</a></li>
        <li class="nav-item"><a class="nav-link" href="/attendance">Attendance</a></li>
        <li class="nav-item"><a class="nav-link" href="/marks">Marks</a></li>
        <li class="nav-item"><a class="nav-link" href="/reports">Reports</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{cat}}">{{msg}}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
