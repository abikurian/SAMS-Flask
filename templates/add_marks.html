{% extends "base.html" %}
{% block content %}
<h3>Add Marks</h3>
<form method="post">

  <!-- Department -->
  <div class="mb-2">
    <label>Department</label>
    <select name="department" id="departmentSelect" class="form-control" required>
      <option value="">-- Select Department --</option>
      {% for d in departments %}
        <option value="{{ d }}">{{ d }}</option>
      {% endfor %}
    </select>
  </div>

  <!-- Student -->
  <div class="mb-2">
    <label>Student</label>
    <select name="student_id" id="studentSelect" class="form-control" required>
      <option value="">-- Select Student --</option>
      {% for s in students %}
        <option value="{{ s.id }}" data-dept="{{ s.department }}">{{ s.name }} ({{ s.roll_no }})</option>
      {% endfor %}
    </select>
  </div>

  <!-- Subject -->
  <div class="mb-2">
    <label>Subject</label>
    <select name="subject_id" id="subjectSelect" class="form-control" required>
      <option value="">-- Select Subject --</option>
      {% for sub in subjects %}
        <option value="{{ sub.id }}" data-dept="{{ sub.department }}">{{ sub.name }}</option>
      {% endfor %}
    </select>
  </div>

  <!-- Exam Type -->
  <div class="mb-2">
    <label>Exam Type</label>
    <select name="exam_type" id="examType" class="form-control" required>
      <option value="">-- Select Exam Type --</option>
      <option value="Internal">Internal</option>
      <option value="Sem">Sem</option>
    </select>
  </div>

  <!-- Marks -->
  <div class="mb-2">
    <label>Marks Obtained</label>
    <input name="marks_obtained" placeholder="Marks Obtained" type="number" step="0.01" class="form-control" required>
  </div>

  <div class="mb-2">
    <label>Max Marks</label>
    <input name="max_marks" id="maxMarks" placeholder="Max Marks" type="number" step="0.01" class="form-control" readonly>
  </div>

  <button class="btn btn-primary">Add</button>
  <a class="btn btn-secondary" href="/marks">Cancel</a>
</form>

<script>
  const deptSelect = document.getElementById('departmentSelect');
  const studentSelect = document.getElementById('studentSelect');
  const subjectSelect = document.getElementById('subjectSelect');
  const examType = document.getElementById('examType');
  const maxMarks = document.getElementById('maxMarks');

  // Filter students and subjects by department
  deptSelect.addEventListener('change', function() {
    const selectedDept = this.value;

    // Filter students
    Array.from(studentSelect.options).forEach(option => {
      if (!selectedDept || option.dataset.dept === selectedDept) {
        option.style.display = '';
      } else {
        option.style.display = 'none';
      }
    });
    studentSelect.value = '';

    // Filter subjects
    Array.from(subjectSelect.options).forEach(option => {
      if (!selectedDept || option.dataset.dept === selectedDept) {
        option.style.display = '';
      } else {
        option.style.display = 'none';
      }
    });
    subjectSelect.value = '';
  });

  // Auto set max marks based on exam type
  examType.addEventListener('change', function() {
    if (this.value === 'Internal') {
      maxMarks.value = 40;
    } else if (this.value === 'Sem') {
      maxMarks.value = 100;
    } else {
      maxMarks.value = '';
    }
  });
</script>
{% endblock %}
